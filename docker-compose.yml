services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/data/orlando.db
      - CMS_SHEET_ID=1robcUP4JwMFHiVldsJDvS13mTqIWDyD1XEN7GGilKRU
      - GOOGLE_SHEETS_CREDENTIALS_PATH=/app/credentials/service-account.json
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    ports:
      # o tunnel do host (projeto ~/docker/cloudflare) aponta
      # orlando.pessanhaserver.com.br -> http://192.168.3.253:3000
      - "3000:3000"
