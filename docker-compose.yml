services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/data/orlando.db
    volumes:
      - ./data:/app/data
    ports:
      # acesso direto na rede local (opcional; o tunnel usa a rede interna do compose)
      - "3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
